<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>よしたっくのアプリポータル</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-5xl mx-auto mb-8 text-center md:text-left">
    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
      Web App Portfolio
    </h1>
    <p class="text-slate-400 mt-2 text-sm md:text-base">自作Webアプリケーションのポータルサイト</p>
  </header>

  <main class="max-w-5xl mx-auto space-y-10">

    <!-- Category 1 -->
    <section>
      <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-2">
        <span class="text-xl">🛠️</span>
        <h2 class="text-xl font-semibold text-slate-200">学習アプリ</h2>
      </div>

      <!-- App Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- App Card 1 -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-blue-500 transition-all">
          <img src="https://placehold.co/600x350/1e293b/64748b?text=App+Screenshot" alt="アプリサムネイル" class="w-full h-40 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-2">
                <h3 class="font-bold text-lg text-white">アプリ名 1</h3>
                <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">React</span>
              </div>
              <p class="text-slate-400 text-sm mb-4">アプリの簡単な説明や主な機能をここに記載します。</p>
            </div>
            <div class="flex gap-2">
              <a href="https://yoshitakkk.github.io/Eiken/" target="_blank" class="flex-1 text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition-colors">
                アプリを開く
              </a>
              <a href="https://github.com/username/app-1" target="_blank" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm transition-colors" title="GitHub Repository">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
              </a>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Category 2 -->
    <section>
      <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-2">
        <span class="text-xl">🎮</span>
        <h2 class="text-xl font-semibold text-slate-200">ゲーム・ミニアプリ</h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- アプリカードを追加 -->
      </div>
    </section>

  </main>
</body>
</html>
