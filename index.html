<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>よしたっくのアプリポータル</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-5xl mx-auto mb-8 text-center md:text-left">
    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
      よしたっくのアプリポータル
    </h1>
     </header>

  <main class="max-w-5xl mx-auto space-y-10">

    <!-- Category 1 -->
    <section>
      <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-2">
        <span class="text-xl">🛠️</span>
        <h2 class="text-xl font-semibold text-slate-200">学習アプリ</h2>
      </div>

      <!-- App Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- App Card 1 -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-blue-500 transition-all">
          <img src="https://yoshitakkk.github.io/Eiken/EikenJyun2.png" alt="英検準2級対策" class="w-full h-40 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-lg text-white mb-4">英検準2級対策</h3>
            </div>
            <div class="flex gap-2">
              <a href="https://yoshitakkk.github.io/Eiken/index.html" target="_blank" class="flex-1 text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition-colors">
                アプリを開く
              </a>
            </div>
          </div>
        </div>

        <!-- App Card 2 -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-blue-500 transition-all">
          <img src="https://yoshitakkk.github.io/Kanji/Kanji.png" alt="小学生低学年漢字" class="w-full h-40 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-lg text-white mb-4">小学生低学年漢字</h3>
            </div>
            <div class="flex gap-2">
              <a href="https://yoshitakkk.github.io/Kanji/index.html" target="_blank" class="flex-1 text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition-colors">
                アプリを開く
              </a>
            </div>
          </div>
        </div>

        <!-- App Card 3 -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-blue-500 transition-all">
          <img src="https://via.placeholder.com/400x200" alt="学習アプリ3" class="w-full h-40 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-lg text-white mb-4">国旗あてクイズ</h3>
            </div>
            <div class="flex gap-2">
              <a href="https://yoshitakkk.github.io/NationalFlag/index.html#" target="_blank" class="flex-1 text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition-colors">
                アプリを開く
              </a>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Category 2 -->
    <section>
      <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-2">
        <span class="text-xl">🎮</span>
        <h2 class="text-xl font-semibold text-slate-200">ゲーム・ミニアプリ</h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- アプリカードを追加 -->
      </div>
    </section>

  </main>
</body>
</html>
